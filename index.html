<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rapunzel 💘</title>

  <style>
    body {
      margin: 0;
      height: 130vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom right, #ffb6c1, #ffe4e1);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      width: 490px;
      text-align: center;
      border-radius: 25px;
      box-shadow: 0 14px 25px rgba(0,0,0,0.2);
      position: relative;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 18px;
    }

    p {
      font-size: 20px;
      margin-bottom: 24px;
      color: #444;
    }

    button {
      padding: 25px 35px;
      font-size: 24px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.2s;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      margin-right: 15px;
    }

    #yesBtn:hover {
      transform: scale(1.05);
    }

    #noBtn {
      background: #d3d3d3;
      color: black;
      position: absolute;
    }

    #loveGif {
      display: none;
      margin-top: 20px;
      width: 470px;
      border-radius: 15px;
    }

    #finalText {
      font-size: 18px;
      color: #ff2e63;
      font-weight: bold;
      margin-top: 15px;
      display: none;
    }
    @media (max-width: 500px) {
  .card {
    width: 90%;
    max-width: 400px;   /* prevents it from being too wide on small screens */
    padding: 20px;
  }
  h1 {
    font-size: 38px;
  }
  button {
    font-size: 16px;
    padding: 10px 20px;
    margin: 8px;   /* better spacing for fat fingers */
  }
  #loveGif {
    width: 100%;
    max-width: 350px;
  }
}
  </style>
</head>
 <body></body>
<body>
  <div class="card">
    <img
  id="pussGif"   
  src="https://media1.tenor.com/m/CM-AQU_GJXcAAAAd/shrek-puss-in-boots.gif"
  alt="Puss in Boots with big pleading eyes"
  style="width: 100%; max-width: 280px; border-radius: 15px; margin: 0 auto 20px auto; display: block;"
>
    <h1>will you be my Valentine?</h1>

    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>

    <div id="finalText">Yayyy!! I love you  😭💘</div>
    <img id="loveGif" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" />
  </div>

  <script>
    
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const loveGif = document.getElementById("loveGif");
  const finalText = document.getElementById("finalText");

  let attempts = 0;
  
// Fix initial position (your old "_10px" was broken → make it visible at start)
  noBtn.style.position = "absolute";
  noBtn.style.left = "px";   // starting spot – adjust if needed
  noBtn.style.top = "px";

  // Desktop: mouse hover makes it run
  noBtn.addEventListener("mouseover", moveNoButton);

  // Mobile: touch makes it run (this is the key addition)
  noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();  // prevents accidental "click" right away
    moveNoButton();      // reuse the same move function
  });

  // Shared move function (cleaner code)
  function moveNoButton() {
    attempts++;

    const card = document.querySelector(".card");
    const cardRect = card.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    // Calculate safe random position inside the card
    const maxX = cardRect.width - btnRect.width - 40;
    const maxY = cardRect.height - btnRect.height - 80;  // more room at bottom

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    // Shrink every 2 attempts
    if (attempts % 2 === 0) {
      let currentSize = parseFloat(window.getComputedStyle(noBtn).fontSize);
      noBtn.style.fontSize = (currentSize - 3) + "px";
      noBtn.style.padding = "6px 16px";
    }

    // Optional: after many attempts, make "No" give up
    if (attempts >= 20) {
      noBtn.textContent = "Okay... 😭";
      noBtn.style.background = "#ff4d6d";
      noBtn.style.color = "white";
      noBtn.style.pointerEvents = "none";  // stops moving
    }
  }

  // YES button – same as before
  yesBtn.addEventListener("click", () => {
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
    document.getElementById("pussGif").style.display = "none";  // ← Add this line
    loveGif.style.display = "block";
    finalText.style.display = "block";
  });
  </script>
</body>
</html>
